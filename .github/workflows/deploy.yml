name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Настроить SSH-агент с ключом деплоя
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Добавить VPS в known_hosts
        run: ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Залить файлы на VPS (rsync)
        run: |
          rsync -avz --delete \
            --exclude='LICENSE' \
            --exclude='README.md' \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='venv/' \
            --exclude='__pycache__/' \
            --exclude='*.pyc' \
            --exclude='.idea/' \
            --exclude='.vscode/' \
            --exclude='logs/' \
            --exclude='*.log' \
            --exclude='.env' \
            ./ "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_PATH }}/"

      - name: Перезапустить бота на VPS
        run: |
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "sudo systemctl restart ${{ secrets.VPS_SERVICE_NAME }} && sudo systemctl is-active ${{ secrets.VPS_SERVICE_NAME }}"
